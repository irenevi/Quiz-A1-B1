<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz PLIDA B1 – Italiano</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f7fa;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #009246 0%, #009246 33%, #fff 33%, #fff 66%, #ce2b37 66%);
    padding: 0;
    height: 8px;
  }

  .hero {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 28px 24px 20px;
    text-align: center;
  }

  .hero h1 {
    font-size: 1.7rem;
    font-weight: 700;
    color: #009246;
    margin-bottom: 6px;
  }

  .hero p {
    color: #555;
    font-size: 0.97rem;
  }

  .badge {
    display: inline-block;
    background: #ce2b37;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .progress-bar-wrap {
    background: #e8e8e8;
    border-radius: 8px;
    height: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar {
    height: 8px;
    background: linear-gradient(90deg, #009246, #00c853);
    border-radius: 8px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 0.82rem;
    color: #777;
    text-align: right;
    margin-bottom: 6px;
  }

  .section-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ce2b37;
    margin: 28px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #ce2b37;
  }

  .question-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    border-left: 4px solid #009246;
    transition: border-color 0.3s;
  }

  .question-card.answered-correct {
    border-left-color: #00c853;
    background: #f0fff5;
  }

  .question-card.answered-wrong {
    border-left-color: #ce2b37;
    background: #fff5f5;
  }

  .question-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: #009246;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .question-text {
    font-size: 1rem;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    background: #f8f9fb;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.93rem;
    color: #1a1a2e;
    cursor: pointer;
    text-align: left;
    transition: all 0.18s;
    font-family: inherit;
  }

  .option-btn:hover:not(:disabled) {
    border-color: #009246;
    background: #f0fff5;
  }

  .option-btn.correct {
    border-color: #00c853;
    background: #e6f9ee;
    color: #006d2c;
    font-weight: 600;
  }

  .option-btn.wrong {
    border-color: #ce2b37;
    background: #ffe6e8;
    color: #8b0000;
  }

  .option-btn:disabled {
    cursor: default;
  }

  .feedback {
    margin-top: 10px;
    font-size: 0.87rem;
    padding: 8px 12px;
    border-radius: 6px;
    display: none;
    line-height: 1.4;
  }

  .feedback.show { display: block; }
  .feedback.correct { background: #e6f9ee; color: #006d2c; }
  .feedback.wrong { background: #ffe6e8; color: #8b0000; }

  .submit-wrap {
    text-align: center;
    margin-top: 32px;
  }

  .btn-submit {
    background: #009246;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 40px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }

  .btn-submit:hover { background: #007a39; }

  .btn-reset {
    background: #fff;
    color: #ce2b37;
    border: 2px solid #ce2b37;
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-left: 12px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .btn-reset:hover { background: #ce2b37; color: #fff; }

  .result-panel {
    display: none;
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    margin-top: 28px;
  }

  .result-panel.show { display: block; }

  .score-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #009246, #00c853);
    color: #fff;
    font-size: 2rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .result-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .result-subtitle {
    color: #555;
    font-size: 0.97rem;
    margin-bottom: 20px;
  }

  .result-level {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 20px;
  }

  .level-ottimo { background: #e6f9ee; color: #006d2c; }
  .level-bene { background: #fff8e1; color: #e65100; }
  .level-ripassa { background: #ffe6e8; color: #8b0000; }

  @media (max-width: 500px) {
    .hero h1 { font-size: 1.3rem; }
    .question-card { padding: 16px 14px; }
  }
</style>
</head>
<body>

<header></header>

<div class="hero">
  <h1>🇮🇹 Quiz PLIDA B1 – Italiano</h1>
  <p>Ripassa grammatica e vocabolario dai livelli A1 fino al B1</p>
  <span class="badge">50 domande</span>
</div>

<div class="container">
  <div class="progress-label" id="progressLabel">Domanda 0 di 50</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quizContainer"></div>

  <div class="submit-wrap">
    <button class="btn-submit" onclick="showResults()">Vedi il risultato</button>
    <button class="btn-reset" onclick="resetQuiz()">Ricomincia</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="score-circle" id="scoreCircle">0</div>
    <div class="result-title" id="resultTitle">Risultato</div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-level" id="resultLevel"></div>
    <br>
    <button class="btn-reset" onclick="resetQuiz()">Rifai il quiz</button>
  </div>
</div>

<script>
const questions = [
  // ── SEZIONE 1: ARTICOLI E NOMI (A1) ──

    ans: 2,
    exp: "Il contrario di AUMENTARE è DIMINUIRE (ridurre, calare)."
  },
  {
    section: "Vocabolario e comprensione (B1)",
    q: "Qual è il significato di «in gamba»?",
    opts: ["con le gambe rotte", "capace e bravo", "di fretta", "malato"],
    ans: 1,
    exp: "«In gamba» è un'espressione idiomatica che significa capace, bravo, sveglio."
  },
  {
    section: "Vocabolario e comprensione (B1)",
    q: "Quale connettivo indica CONTRASTO?",

    opts: ["parte", "partiva", "partirà", "sia partita"],

    exp: "Nel discorso indiretto al passato, il presente indicativo → imperfetto: PARTIVA il giorno dopo."

];

let answered = new Array(questions.length).fill(false);
let correct = new Array(questions.length).fill(false);

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  let currentSection = '';

  questions.forEach((q, idx) => {
    if (q.section !== currentSection) {
      currentSection = q.section;
      const sec = document.createElement('div');
      sec.className = 'section-title';
      sec.textContent = q.section;
      container.appendChild(sec);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + idx;

    const num = document.createElement('div');
    num.className = 'question-num';
    num.textContent = `Domanda ${idx + 1}`;

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.textContent = q.q;

    const opts = document.createElement('div');
    opts.className = 'options';

    q.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.id = `btn-${idx}-${oi}`;
      btn.onclick = () => selectAnswer(idx, oi);
      opts.appendChild(btn);
    });

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = 'feedback-' + idx;

    card.appendChild(num);
    card.appendChild(qText);
    card.appendChild(opts);
    card.appendChild(feedback);
    container.appendChild(card);
  });

  updateProgress();
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answered[qIdx] = true;

  const q = questions[qIdx];
  const card = document.getElementById('card-' + qIdx);
  const feedback = document.getElementById('feedback-' + qIdx);
  const isCorrect = optIdx === q.ans;
  correct[qIdx] = isCorrect;

  // Disable all buttons
  q.opts.forEach((_, oi) => {
    const btn = document.getElementById(`btn-${qIdx}-${oi}`);
    btn.disabled = true;
    if (oi === q.ans) btn.classList.add('correct');
    else if (oi === optIdx && !isCorrect) btn.classList.add('wrong');
  });

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  feedback.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  feedback.textContent = (isCorrect ? '✅ Corretto! ' : '❌ Sbagliato. ') + q.exp;

  updateProgress();
}

function updateProgress() {
  const done = answered.filter(Boolean).length;
  const pct = Math.round((done / questions.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `Domanda ${done} di ${questions.length}`;
}

function showResults() {
  const total = questions.length;
  const score = correct.filter(Boolean).length;
  const pct = Math.round((score / total) * 100);

  const panel = document.getElementById('resultPanel');
  panel.classList.add('show');
  document.getElementById('scoreCircle').textContent = `${score}/${total}`;

  let title, subtitle, levelClass, levelText;
  if (pct >= 80) {
    title = 'Ottimo lavoro! 🎉';
    subtitle = `Hai risposto correttamente a ${score} domande su ${total} (${pct}%). Sei pronto per l'esame!`;
    levelClass = 'level-ottimo';
    levelText = '🏆 Livello: Eccellente';
  } else if (pct >= 60) {
    title = 'Bene, continua così! 💪';
    subtitle = `Hai risposto correttamente a ${score} domande su ${total} (${pct}%). Ripassa gli argomenti sbagliati.`;
    levelClass = 'level-bene';
    levelText = '📚 Livello: Buono';
  } else {
    title = 'Continua a studiare! 📖';
    subtitle = `Hai risposto correttamente a ${score} domande su ${total} (${pct}%). Serve più ripasso.`;
    levelClass = 'level-ripassa';
    levelText = '🔄 Livello: Da ripassare';
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSubtitle').textContent = subtitle;
  const lvl = document.getElementById('resultLevel');
  lvl.className = `result-level ${levelClass}`;
  lvl.textContent = levelText;

  panel.scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
  answered = new Array(questions.length).fill(false);
  correct = new Array(questions.length).fill(false);
  document.getElementById('resultPanel').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
